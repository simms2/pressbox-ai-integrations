name: Publish Pressbox public News Wire to MCP Registry
on:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp-registry.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pressbox-public-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v5
      - name: Validate exact public Pressbox MCP identity and safe read-only source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg=json.loads(Path("server.json").read_text())
          assert cfg["name"]=="io.github.simms2/pressbox-news-wire"
          assert cfg["version"]=="1.0.0"
          assert len(cfg["description"])<=100
          assert cfg["repository"]["url"]=="https://github.com/simms2/pressbox-ai-integrations"
          assert cfg["remotes"]==[{"type":"streamable-http","url":"https://pressbox.com/mcp"}]
          assert not cfg.get("packages")
          assert not any(k in cfg for k in ("authentication", "auth", "headers", "credentials"))
          print("Public-only metadata and namespace validated.")
          PY
      - name: Confirm Pressbox public News Wire responds with read-only capabilities
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 \
            --max-time 20 https://pressbox.com/api/v1/public-mcp > public-mcp.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          response=json.loads(Path("public-mcp.json").read_text())
          assert response.get("status")=="live", response
          print("Public Pressbox News Wire is live.")
          PY
      - name: Install Sigstore cosign for verifying registry publisher binary
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify pinned official mcp-publisher v1.8.1
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Validate official MCP Registry metadata
        run: ./mcp-publisher validate server.json
      - name: Authenticate registry with GitHub Actions OIDC (no secret)
        run: ./mcp-publisher login github-oidc --registry=https://registry.modelcontextprotocol.io
      - name: Publish Pressbox News Wire public MCP entry
        run: ./mcp-publisher publish server.json
